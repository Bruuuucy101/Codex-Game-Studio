<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Signal Field · Three.js</title></head>
<body data-engine="threejs"><main><header><p class="eyebrow">CCGS / Three.js starter</p><h1>Signal Field</h1><p>Find your way. Collect three signals.</p></header>
<section class="hud" aria-label="Game status"><div>Signals <strong id="score" aria-live="polite">0 / 3</strong></div><div>Position <output id="position">60, 180</output></div><button id="reset" type="button">Reset game</button></section>
<div id="game" aria-label="Collect game"></div><p id="instructions">Focus the field, then use arrow keys or WASD. Click a destination to move. Collect every gold diamond. Reset to play again.</p><p id="status" role="status">Ready to explore</p>
</main><script type="module" src="/src/main.ts"></script></body></html>
