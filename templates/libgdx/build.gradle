allprojects {
    repositories { mavenCentral() }
}
subprojects {
    apply plugin: 'java-library'
    java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
    tasks.withType(JavaCompile).configureEach {
        options.release = 8
        options.encoding = 'UTF-8'
    }
    dependencyLocking {
        lockAllConfigurations()
        lockMode = LockMode.STRICT
    }
    dependencies {
        testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.13.4'
    }
    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        maxParallelForks = 1
        systemProperty 'junit.jupiter.execution.parallel.enabled', 'false'
        testLogging { events 'passed', 'skipped', 'failed' }
    }
}

// Resolve all runtime/test graphs only when deliberately refreshing committed locks.
tasks.register('resolveDependencyLocks') {
    doLast {
        subprojects.each { module ->
            module.configurations.findAll { it.canBeResolved }.each { it.resolve() }
        }
    }
}
